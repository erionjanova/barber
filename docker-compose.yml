services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barbershop
      POSTGRES_USER: barbershop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbershop -d barbershop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=db;Port=5432;Database=barbershop;Username=barbershop;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      Admin__Email: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      Admin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      Admin__FullName: ${ADMIN_NAME:-Barber}
      Admin__PhoneNumber: ${SHOP_PHONE:-}
      Shop__Name: ${SHOP_NAME:-Barber}
      Shop__Address: ${SHOP_ADDRESS:-}
      Shop__Phone: ${SHOP_PHONE:-}
      Shop__BarberEmail: ${BARBER_EMAIL:-}
      Shop__TimeZone: ${SHOP_TIMEZONE:-Europe/Tirane}
      Shop__FrontendUrl: ${PUBLIC_URL:-http://localhost:8080}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__UseTls: ${SMTP_USE_TLS:-false}
      Smtp__FromEmail: ${SMTP_FROM:-no-reply@barbershop.local}
      Smtp__FromName: ${SHOP_NAME:-Barber}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"

volumes:
  pgdata:
